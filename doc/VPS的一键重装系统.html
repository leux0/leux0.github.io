<h1 id="脚本一键重装系统"><a href="#脚本一键重装系统" class="headerlink" title="脚本一键重装系统"></a>脚本一键重装系统</h1><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 本脚本至少需要 512MB 内存 + 1.5GB 硬盘，目前Debian 13安装完占用存储625M，注意其不支持 OpenVZ、LXC 等虚拟机</span></span><br><span class="line"><span class="comment"># 脚本会最大化利用磁盘空间：不含 boot 分区（Fedora 例外），不含 swap 分区。自动根据机器类型选择不同的优化内核，例如 Cloud、HWE 内核</span></span><br><span class="line">wget -O reinstall.sh https://github.com/bin456789/reinstall/raw/main/reinstall.sh</span><br><span class="line">bash reinstall.sh debian --password [PASSWORD] --ssh-port [PORT] --hold 2</span><br><span class="line"></span><br><span class="line"><span class="comment"># 以重装Debian 13为例，安装最新版系统可不输入版本号，部分参数如下：</span></span><br><span class="line">--hold 2			<span class="comment"># 安装结束后不立即重启，此时可以 SSH 登录修改系统内容，系统挂载在 /os (此功能不支持 Debian/Kali)</span></span><br><span class="line">--frpc-toml /path/to/frpc.toml	<span class="comment"># 添加 frpc 内网穿透</span></span><br><span class="line">--web-port PORT			<span class="comment"># 修改 Web 端口（安装期间观察日志用）</span></span><br><span class="line">--ssh-port PORT			<span class="comment"># 修改 SSH 端口（安装期间观察日志用，也作用于新系统）</span></span><br><span class="line">--password PASSWORD		<span class="comment"># 设置密码，如不设置默认用户名：root  默认密码：123@@@</span></span><br><span class="line">--ssh-key KEY			<span class="comment"># 设置 SSH 登录公钥，当使用公钥时，密码为空，支持以下格式：</span></span><br><span class="line">--ssh-key <span class="string">&quot;ssh-rsa ...&quot;</span>		--ssh-key <span class="string">&quot;ssh-ed25519 ...&quot;</span>		--ssh-key <span class="string">&quot;ecdsa-sha2-nistp256/384/521 ...&quot;</span></span><br><span class="line">--ssh-key /path/to/public_key	--ssh-key github:your_username		--ssh-key http://path/to/public_key</span><br><span class="line"></span><br><span class="line"><span class="comment"># 也可选择重启到 Alpine Live OS（内存系统），可用 SSH 连接，进行备份/恢复硬盘、手动 DD、修改分区、手动安装 Alpine/Arch/Gentoo 等操作</span></span><br><span class="line">./reinstall.sh alpine --hold=1	<span class="comment"># 用户名 root 默认密码 123@@@，如果手动操作没有破坏原系统，再次重启将回到原系统</span></span><br><span class="line">./reinstall.sh netboot.xyz	<span class="comment"># 或者重启到 netboot.xyz 来用商家后台 VNC 手动安装 更多系统，如果手动操作没有破坏原系统，再次重启将回到原系统</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 脚本执行完后会生成 /boot/grub/custom.cfg 文件，该配置文件会在GRUB菜单中添加一条网络启动的项，首次重启后自动进入该选项后即可在云服务商控制台VNC中操作来网络安装</span></span><br><span class="line"><span class="comment"># 如果首次安装失败，后续可以在GRUB菜单中手动选择 reinstall 项再次进行安装，该配置文件 /boot/grub/custom.cfg 主要内容如下：</span></span><br><span class="line">......</span><br><span class="line">menuentry <span class="string">&quot;reinstall (debian 13)&quot;</span> --unrestricted &#123;</span><br><span class="line">    insmod lvm</span><br><span class="line">    insmod all_video</span><br><span class="line">    search --no-floppy --file --<span class="built_in">set</span>=root /reinstall-vmlinuz</span><br><span class="line">    linux /reinstall-vmlinuz lowmem/low=1 auto=<span class="literal">true</span> priority=critical url=https://raw.githubusercontent.com/bin456789/reinstall/main/debian.cfg mirror/http/hostname=deb.debian.org mirror/http/directory=/debian base-installer/kernel/image=linux-image-cloud-amd64   extra_confhome=<span class="string">&#x27;https://raw.githubusercontent.com/bin456789/reinstall/main&#x27;</span> extra_hold=2 extra_main_disk=45f2e6fa extra_elts=0 extra_deb_mirror=deb.debian.org/debian extra_ssh_port=22</span><br><span class="line">    initrd /reinstall-initrd</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="comment"># 上面的 extra_main_disk 内容来自 blkid 中 PARTUUID 的值</span></span><br><span class="line">/dev/vda1: UUID=<span class="string">&quot;67eedb9c-5877-4061-a42e-40d0aabf95a2&quot;</span> BLOCK_SIZE=<span class="string">&quot;4096&quot;</span> TYPE=<span class="string">&quot;ext4&quot;</span> PARTUUID=<span class="string">&quot;45f2e6fa-01&quot;</span></span><br><span class="line"><span class="comment"># 重装后默认安装 Cloud 内核，如需切换到通用内核，重启前将上面GRUB配置文件中的 linux-image-cloud-amd64 改成 linux-image-amd64 即可</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 脚本执行后产生的相关文件</span></span><br><span class="line">/boot/grub/custom.cfg		<span class="comment"># 新增的自定义GRUB配置</span></span><br><span class="line">/reinstall.log			<span class="comment"># 脚本执行所产生的日志文件</span></span><br><span class="line">/reinstall-initrd		<span class="comment"># 该文件是由 /reinstall-tmp/initrd/ 目录制作而成的</span></span><br><span class="line">/reinstall-vmlinuz		<span class="comment"># https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64/linux</span></span><br><span class="line">/reinstall-tmp/			<span class="comment"># https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64/initrd.gz</span></span><br><span class="line">├── initrd/			<span class="comment"># 由上面链接官方 initrd.gz 解包后添加几个脚本和配置而成，最终会打包制作成 /reinstall-initrd 镜像</span></span><br><span class="line">├── fdisk/			<span class="comment"># 该目录和后面的几个文件都是软件包 fdisk-udeb 解包产生的</span></span><br><span class="line">├── control.tar.xz</span><br><span class="line">├── data.tar.xz</span><br><span class="line">├── debian-binary</span><br><span class="line">├── tmp.udeb</span><br><span class="line">└── udeb_list</span><br><span class="line"></span><br><span class="line"><span class="comment"># 可将 /boot/grub/custom.cfg /reinstall-initrd /reinstall-vmlinuz 这三个文件放到其他系统上对应位置便能重装而不用执行该脚本，SSHD密钥码端口等均为上面脚本执行时设置的</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 上面系统重装后它对于SSHD的配置改动和内容在如下位置：</span></span><br><span class="line">/etc/ssh/sshd_config.d/01-change-ssh-port.conf			Port 22</span><br><span class="line">/etc/ssh/sshd_config.d/01-permitrootlogin.conf			PermitRootLogin <span class="built_in">yes</span></span><br><span class="line"></span><br><span class="line">除此之外，它还可以添加一些密钥</span><br><span class="line">root@localhost:~# tree -L 1 /etc/ssh/</span><br><span class="line">/etc/ssh/</span><br><span class="line">......</span><br><span class="line">├── ssh_host_ecdsa_key</span><br><span class="line">├── ssh_host_ecdsa_key.pub		<span class="comment"># --ssh-key &quot;ecdsa-sha2-nistp256 ...&quot;</span></span><br><span class="line">├── ssh_host_ed25519_key</span><br><span class="line">├── ssh_host_ed25519_key.pub		<span class="comment"># --ssh-key &quot;ssh-ed25519 ...&quot;</span></span><br><span class="line">├── ssh_host_rsa_key</span><br><span class="line">└── ssh_host_rsa_key.pub		<span class="comment"># --ssh-key &quot;ssh-rsa ...&quot;</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 如需更换安装镜像源，使用前请自己修改 reinstall.sh 文件 setos_debian() 函数中的 udeb_mirror（安装时的源）和deb_mirror（安装后要修改成的源）</span></span><br><span class="line"><span class="comment"># frpc的配置可参考这个：https://github.com/bin456789/reinstall/blob/main/frpc-example.toml</span></span><br></pre></td></tr></table></figure>


<h1 id="SSH登录安全相关"><a href="#SSH登录安全相关" class="headerlink" title="SSH登录安全相关"></a>SSH登录安全相关</h1><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 建议在 /etc/ssh/sshd_config.d/ 创建一个 conf 文件来自定义 sshd 配置，而不是直接编辑 /etc/ssh/sshd_config，防止 OpenSSH 更新后配置冲突</span></span><br><span class="line"><span class="comment"># 若主配置文件 /etc/ssh/sshd_config 首行为 Include /etc/ssh/sshd_config.d/*.conf ，则该目录里的子配置文件中任何项都优先于主配置文件中的</span></span><br><span class="line"><span class="comment"># SSHD配置修改完可先用 sudo sshd -T 看一下有效配置，免得被覆盖了都不知道，注意：prohibit-password 是 without-password 的别名</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 禁止Root用户通过密码远程登录想法是好的，但在服务器故障需要救援时就会变麻烦，所以更推荐只关闭远程密码登录而保留本地密码登录，这样挂掉时也能通过服务商VNC本地登录Root进行救援</span></span><br><span class="line">Port 22							<span class="comment"># 设置 SSHD 端口</span></span><br><span class="line">PermitEmptyPasswords no					<span class="comment"># 禁用空密码登陆（默认）</span></span><br><span class="line">PermitRootLogin prohibit-password			<span class="comment"># 禁止Root用户通过密码远程登录，no 为禁用Root登录包括本地</span></span><br><span class="line">PasswordAuthentication no				<span class="comment"># 关闭远程密码登录</span></span><br><span class="line">PubkeyAuthentication <span class="built_in">yes</span>				<span class="comment"># 允许密钥登录</span></span><br><span class="line">AuthorizedKeysFile .ssh/authorized_keys			<span class="comment"># 指定公钥路径</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 服务端生成密钥对并发送给客户端让其通过密钥登录</span></span><br><span class="line"><span class="built_in">cd</span> ~/.ssh						<span class="comment"># 服务端只需要留公钥，客户端则需要私钥即可</span></span><br><span class="line">ssh-keygen -t rsa					<span class="comment"># 生成密钥对，将生成的id_rsa和id_rsa.pub备份到自己的本地电脑</span></span><br><span class="line"><span class="built_in">mv</span> id_rsa.pub authorized_keys				<span class="comment"># 导入公钥后建议删除服务器端的私钥以保证安全</span></span><br><span class="line"><span class="built_in">rm</span> id_rsa						<span class="comment"># 妥善保存id_rsa私钥后再删除，丢了服务器可就没法远程登陆了</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 也可在客户端 Windows PowerShell 中生成密钥对并发送到服务端</span></span><br><span class="line">PS C:\Users\leux&gt; <span class="built_in">cd</span> <span class="variable">$HOME</span>\.ssh\			<span class="comment"># ssh-keygen 的默认密钥生成路径都是：$HOME/.ssh ，生成前进入只是为了更好操作生成后的密钥</span></span><br><span class="line">PS C:\Users\leux\.ssh&gt; ssh-keygen -t ed25519		<span class="comment"># 完成后会生成私钥id_ed25519和公钥id_ed25519.pub，将 id_ed25519.pub 放到服务器的 ~/.ssh/authorized_keys</span></span><br><span class="line">PS C:\Users\leux\.ssh&gt; ssh [username]@[ip] -p [port]	<span class="comment"># 后续只要 $HOME/.ssh/ 中存在名为 id_rsa id_ecdsa id_ed25519 的私钥文件均可通过其来登录</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment"># 也可以通过 PAM 模块在每次SSH登录时触发脚本来实现自动发通知，编辑 /etc/pam.d/sshd 文件在末尾添加：</span></span><br><span class="line">session    optional    pam_exec.so /usr/local/bin/notify_ssh_login.sh</span><br><span class="line"></span><br><span class="line"><span class="comment"># 这里使用推送加的API来将登录用户的信息推送到微信公众号，如下是登录时触发的脚本内容：sudo chmod +x /usr/local/bin/notify_ssh_login.sh</span></span><br><span class="line"><span class="comment">#!/bin/bash</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 如果登录失败则退出脚本</span></span><br><span class="line"><span class="keyword">if</span> [ <span class="string">&quot;<span class="variable">$PAM_TYPE</span>&quot;</span> != <span class="string">&quot;open_session&quot;</span> ]; <span class="keyword">then</span></span><br><span class="line">    <span class="built_in">exit</span> 0</span><br><span class="line"><span class="keyword">fi</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 获取登录用户的相关信息</span></span><br><span class="line">IP=<span class="variable">$PAM_RHOST</span></span><br><span class="line">NAME=<span class="variable">$PAM_USER</span></span><br><span class="line">DATE=$(<span class="built_in">date</span> +<span class="string">&quot;%Y-%m-%d %H:%M:%S&quot;</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># pushplus API相关参数，需更改TOKEN值为你的</span></span><br><span class="line">URL=<span class="string">&quot;https://www.pushplus.plus/send/&quot;</span></span><br><span class="line">TOKEN=<span class="string">&quot;You_Token&quot;</span></span><br><span class="line">TITLE=<span class="string">&quot;登录提醒&quot;</span></span><br><span class="line">CONTENT=<span class="string">&quot;&lt;h4&gt;登录信息：&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;登录时间：<span class="variable">$DATE</span>&lt;/li&gt;&lt;li&gt;登录用户：<span class="variable">$NAME</span>&lt;/li&gt;&lt;li&gt;客户端IP：<span class="variable">$IP</span>&lt;/li&gt;&lt;/ul&gt;&quot;</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 发送HTTP POST请求并将响应值存到变量</span></span><br><span class="line">response=$(curl -s -X POST -d <span class="string">&quot;token=<span class="variable">$TOKEN</span>&amp;title=<span class="variable">$TITLE</span>&amp;content=<span class="variable">$CONTENT</span>&quot;</span> <span class="string">&quot;<span class="variable">$URL</span>&quot;</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># 如需额外解析响应的JSON来提取返回码或说明来调试，可安装jq解析并参考如下，响应内容示例：&#123;&quot;code&quot;:200,&quot;msg&quot;:&quot;执行成功&quot;,&quot;data&quot;:&quot;abcdefghijklmnopqrstuvwxyz&quot;&#125;</span></span><br><span class="line"><span class="comment"># code=$(echo &quot;$response&quot; | jq -r &#x27;.code&#x27;)		# 单独获取返回码，返回码说明见：https://www.pushplus.plus/doc/guide/code.html</span></span><br><span class="line"><span class="comment"># echo $response					# 输出所有响应值，DEMO代码参考：https://www.pushplus.plus/doc/guide/demo.html</span></span><br><span class="line"></span><br></pre></td></tr></table></figure>
